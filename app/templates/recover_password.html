<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recover_password.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Map - Recover Password</title>
</head>

<body>
    <div class="recover-container">
        <div class="logo">
            <h1>💰 Money Map</h1>
            <p>Recover Your Account</p>
        </div>

        <!-- Step 1: Email Input -->
        <div id="emailStep" class="step active">
            <h2>Enter Your Email</h2>
            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                <button type="submit" class="btn">Send Verification Code</button>
            </form>
        </div>

        <!-- Step 2: Code Verification -->
        <div id="codeStep" class="step">
            <h2>Enter Verification Code</h2>
            <p class="info-text">We sent a 6-digit code to <span id="userEmail"></span></p>
            <form id="codeForm">
                <div class="form-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" name="code" placeholder="Enter 6-digit code" maxlength="6" required>
                    <div class="error-message" id="codeError"></div>
                </div>
                <button type="submit" class="btn">Verify Code</button>
                <button type="button" class="btn-secondary" id="resendBtn">Resend Code</button>
            </form>
        </div>

        <!-- Step 3: New Password -->
        <div id="passwordStep" class="step">
            <h2>Set New Password</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password"
                        required>
                    <div class="error-message" id="newPasswordError"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"
                        required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
                <button type="submit" class="btn">Reset Password</button>
            </form>
        </div>

        <div class="back-link">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/recover_password.js') }}"></script>
</body>

</html>
